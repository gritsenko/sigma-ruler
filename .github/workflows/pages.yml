name: Publish Sigma Ruler

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Independent of the legacy Pages workflow's queue; serialize new publications.
concurrency:
  group: sigma-pages-actions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published files
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 600000
