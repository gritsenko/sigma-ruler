    <style>html,body{color:#e8e2d0;background:#0b0f17;height:100%;margin:0;font:13px/1.4 system-ui,sans-serif}body{grid-template-rows:auto 1fr;grid-template-columns:210px 1fr 360px;height:100vh;display:grid}header{background:#121a29;border-bottom:1px solid #2a3348;flex-wrap:wrap;grid-column:1/-1;align-items:center;gap:10px;padding:8px 12px;display:flex}header b{margin-right:8px;font-size:15px}header label{align-items:center;gap:6px;display:flex}select,input,button{font:inherit;color:#e8e2d0;background:#1c2438;border:1px solid #2a3348;border-radius:4px;padding:3px 6px}button{cursor:pointer}button.on{background:#3a4a70;border-color:#6f86c0}nav{border-right:1px solid #2a3348;padding:8px;overflow:auto}nav a{color:inherit;border-radius:4px;justify-content:space-between;gap:6px;padding:5px 8px;text-decoration:none;display:flex}nav a:hover{background:#1c2438}nav a.on{background:#2a3a5c}nav small{color:#9aa4b8}nav small.full{color:#8fd48f}main{padding:12px 16px 40px;overflow:auto}section h2{margin:18px 0 6px;font-size:17px}section h3{color:#c9b27a;margin:12px 0 6px;font-size:13px;font-weight:600}.grid{grid-template-columns:repeat(auto-fill, minmax(var(--card), 1fr));gap:8px;display:grid}.card{cursor:pointer;background:#111827;border:1px solid #222b3e;border-radius:6px;flex-direction:column;gap:3px;min-width:0;padding:4px;display:flex}.card:hover{border-color:#4a5a80}.card.sel{border-color:#e0b85a}.card.missing{opacity:.55}.card .pic{aspect-ratio:1;border-radius:4px;place-items:center;display:grid;overflow:hidden}.card canvas,.card img{object-fit:contain;width:100%;height:100%}.card .name{text-overflow:ellipsis;white-space:nowrap;font-size:11px;overflow:hidden}.card .nope{color:#9aa4b8;text-align:center;padding:4px;font-size:11px}.bg-dark .pic,.bg-dark #big{background:#0b0f17}.bg-light .pic,.bg-light #big{background:#e9e4d4}.bg-check .pic,.bg-check #big{background:repeating-conic-gradient(#3a3f4a 0 25%, #2a2e36 0 50%) 0 0 / 16px 16px}.bg-grass .pic,.bg-grass #big{background:#7d9a3a}.bg-sea .pic,.bg-sea #big{background:#2a9fc0}aside{border-left:1px solid #2a3348;padding:12px;overflow:auto}aside h2{word-break:break-all;margin:0 0 8px;font-size:15px}#big{aspect-ratio:1;border-radius:6px;place-items:center;width:100%;display:grid;overflow:hidden}#big canvas,#big img{object-fit:contain;width:100%;height:100%}.row{flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;display:flex}.variants{flex-wrap:wrap;gap:4px;margin:8px 0;display:flex}.variants canvas{object-fit:contain;cursor:pointer;border:1px solid #2a3348;border-radius:4px;width:56px;height:56px}.variants canvas.on{border-color:#e0b85a}dl{grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0;font-size:12px;display:grid}dt{color:#9aa4b8}dd{word-break:break-all;margin:0}.hint{color:#9aa4b8;font-size:12px}@media (width<=900px){body{grid-template-rows:auto auto 1fr auto;grid-template-columns:1fr}nav{border-bottom:1px solid #2a3348;border-right:0;display:flex;overflow-x:auto}nav a{white-space:nowrap}aside{border-top:1px solid #2a3348;border-left:0;max-height:45vh}#big{aspect-ratio:auto;height:26vh}}</style>

  <body class="bg-check">
    <header>
      <b>Sprite lab</b>
      <a href="./sounds.html" style="color: #d7b977">Sound lab ↗</a>
      <label><input id="q" type="search" placeholder="Поиск ключа" /></label>
      <label>Размер <input id="size" type="range" min="56" max="260" value="112" /></label>
      <label
        >Фон
        <select id="bg">
          <option value="check">клетка</option>
          <option value="dark">тёмный</option>
          <option value="light">светлый</option>
          <option value="grass">трава</option>
          <option value="sea">море</option>
        </select></label
      >
      <label
        >Команда
        <select id="team"></select
      ></label>
      <label
        >Пропуски
        <select id="missing">
          <option value="show">показывать</option>
          <option value="hide">скрыть</option>
          <option value="only">только они</option>
        </select></label
      >
      <label><input id="real" type="checkbox" /> масштаб игры</label>
      <span id="status" class="hint"></span>
    </header>
    <nav id="nav"></nav>
    <main id="main"></main>
    <aside id="detail"><p class="hint">Выберите спрайт.</p></aside>
  </body>
